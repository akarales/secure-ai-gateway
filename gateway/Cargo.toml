[package]
name = "secure-ai-gateway"
description = "PHI-aware AI gateway — detect, tokenize, route, audit (axum)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = "0.5.3"

tower-http = { version = "0.7.1", features = ["trace"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1.26.1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }

